>2</text><text x="129.0" y="117.0" class="ink" font-size="13.5" text-anchor="start" font-weight="600" >Contar instancias libres</text><text x="129.0" y="135.0" class="muted" font-size="12" text-anchor="start" font-weight="400" >libres = instancias − asignadas</text><path d="M250,148 L250,166" class="ln" stroke-width="1.6" marker-end="url(#fl)"/><path d="M250,168 L400,200 L250,232 L100,200 Z" class="soft" stroke-width="1.4"/><text x="250.0" y="205.0" class="ink" font-size="13" text-anchor="middle" font-weight="600" >¿Hay ciclos?</text><path d="M400,200 L556,200" class="okl" stroke-width="1.6" marker-end="url(#flo)"/><text x="478.0" y="192.0" class="muted" font-size="12" text-anchor="middle" font-weight="600" >no</text><rect x="560" y="173" width="220" height="66" rx="8" class="okf" stroke-width="1.6"/><text x="574.0" y="195.0" class="ink" font-size="13.5" text-anchor="start" font-weight="700" >Estado seguro</text><text x="574.0" y="213.0" class="muted" font-size="12" text-anchor="start" font-weight="400" >no hay espera circular;</text><text x="574.0" y="229.0" class="muted" font-size="12" text-anchor="start" font-weight="400" >da una secuencia de término</text><path d="M250,232 L250,252" class="ln" stroke-width="1.6" marker-end="url(#fl)"/><text x="260.0" y="246.0" class="muted" font-size="12" text-anchor="start" font-weight="600" >sí</text><path d="M250,254 L400,286 L250,318 L100,286 Z" class="soft" stroke-width="1.4"/><text x="250.0" y="284.0" class="ink" font-size="13" text-anchor="middle" font-weight="600" >¿Algún ciclo con solo</text><text x="250.0" y="300.0" class="ink" font-size="13" text-anchor="middle" font-weight="600" >recursos de 1 instancia?</text><path d="M400,286 L556,286" class="acc" stroke-width="1.6" marker-end="url(#fla)"/><text x="478.0" y="278.0" class="muted" font-size="12" text-anchor="middle" font-weight="600" >sí</text><rect x="560" y="259" width="220" height="66" rx="8" class="accf" stroke-width="1.6"/><text x="574.0" y="281.0" class="ink" font-size="13.5" text-anchor="start" font-weight="700" >Interbloqueo seguro</text><text x="574.0" y="299.0" class="muted" font-size="12" text-anchor="start" font-weight="400" >inseguro irreversible: ese</text><text x="574.0" y="315.0" class="muted" font-size="12" text-anchor="start" font-weight="400" >ciclo no se puede romper</text><path d="M250,318 L250,338" class="ln" stroke-width="1.6" marker-end="url(#fl)"/><text x="260.0" y="332.0" class="muted" font-size="12" text-anchor="start" font-weight="600" >no</text><rect x="85.0" y="340" width="330" height="54" rx="8" class="soft" stroke-width="1.4"/><circle cx="107.0" cy="367" r="12" class="p0" stroke-width="1.2"/><text x="107.0" y="371.5" class="ink" font-size="12.5" text-anchor="middle" font-weight="700" >3</text><text x="129.0" y="363.0" class="ink" font-size="13.5" text-anchor="start" font-weight="600" >Reducir el grafo</text><text x="129.0" y="381.0" class="muted" font-size="12" text-anchor="start" font-weight="400" >termina quien puede; devuelve todo</text><path d="M250,394 L250,412" class="ln" stroke-width="1.6" marker-end="url(#fl)"/><path d="M250,414 L400,446 L250,478 L100,446 Z" class="soft" stroke-width="1.4"/><text x="250.0" y="451.0" class="ink" font-size="13" text-anchor="middle" font-weight="600" >¿Terminan todos?</text><path d="M400,446 L556,446" class="okl" stroke-width="1.6" marker-end="url(#flo)"/><text x="478.0" y="438.0" class="muted" font-size="12" text-anchor="middle" font-weight="600" >sí</text><rect x="560" y="419" width="220" height="66" rx="8" class="okf" stroke-width="1.6"/><text x="574.0" y="441.0" class="ink" font-size="13.5" text-anchor="start" font-weight="700" >Ciclo sin interbloqueo</text><text x="574.0" y="459.0" class="muted" font-size="12" text-anchor="start" font-weight="400" >inseguro reversible;</text><text x="574.0" y="475.0" class="muted" font-size="12" text-anchor="start" font-weight="400" >la reducción da el orden</text><path d="M250,478 L250,498" class="ln" stroke-width="1.6